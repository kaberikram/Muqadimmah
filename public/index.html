<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gyro Spotlight — Projector</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }

    #spotlight-canvas {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      display: none;
    }

    .overlay {
      position: fixed; inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      background: #000;
      color: #fff;
      text-align: center;
      padding: 2rem;
      cursor: default;
    }
    .overlay.visible { display: flex; }

    #qr-img {
      width: min(60vh, 60vw);
      height: min(60vh, 60vw);
      background: #fff;
      padding: 1.5rem;
      border-radius: 1rem;
    }
    .overlay h1 { font-size: clamp(1.5rem, 4vw, 2.5rem); font-weight: 600; }
    .overlay p  { font-size: clamp(0.95rem, 2vw, 1.2rem); color: #999; max-width: 42rem; line-height: 1.5; }

    #disconnect-banner {
      position: fixed; top: 2rem; left: 50%;
      transform: translateX(-50%);
      background: rgba(180, 30, 30, 0.9);
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-size: 1.1rem;
      display: none;
    }
    #disconnect-banner.visible { display: block; }

    #cal-crosshair {
      position: fixed; inset: 0;
      display: none;
      pointer-events: none;
    }
    #cal-crosshair.visible { display: block; }
    #cal-crosshair::before, #cal-crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.35);
    }
    #cal-crosshair::before {
      left: 50%; top: 0; bottom: 0;
      width: 2px; transform: translateX(-50%);
    }
    #cal-crosshair::after {
      top: 50%; left: 0; right: 0;
      height: 2px; transform: translateY(-50%);
    }
    #cal-crosshair span {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, calc(-50% - 2.5rem));
      color: rgba(255, 255, 255, 0.6);
      font-size: 1rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="setup-view" class="overlay visible">
    <img id="qr-img" alt="QR code to pair phone" />
    <h1>Scan with Phone to Pair</h1>
    <p id="mobile-url"></p>
    <p style="color:#666;font-size:0.9rem;">Point phone at screen center → Calibrate → aim like a laser.</p>
  </div>

  <div id="cal-view" class="overlay">
    <h1>Laser Pointer Calibration</h1>
    <p>On the phone: point at the <strong style="color:#fff">center</strong> of this screen, then tap <strong style="color:#fff">Calibrate Center</strong>.</p>
  </div>

  <div id="cal-crosshair"><span>Point here</span></div>

  <canvas id="spotlight-canvas"></canvas>
  <div id="disconnect-banner">Connection lost &mdash; waiting for phone&hellip;</div>

  <script src="/orientation-map.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    'use strict';

    const socket = io();
    const isTestMode = new URLSearchParams(window.location.search).get('test') === '1';

    const setupView = document.getElementById('setup-view');
    const calView = document.getElementById('cal-view');
    const calCrosshair = document.getElementById('cal-crosshair');
    const canvas = document.getElementById('spotlight-canvas');
    const disconnectBanner = document.getElementById('disconnect-banner');
    const ctx = canvas.getContext('2d');

    const DISCONNECT_HOLD_MS = 5000;
    const FADE_DURATION_MS = 1000;

    let state = null;
    let orientation = { beta: 90, gamma: 0, alpha: 0, t: null };
    let pointerX = 0.5;
    let pointerY = 0.5;
    let currentX = null;
    let currentY = null;
    let sensX = 58;
    let sensY = 52;
    let invertX = true;
    let invertY = true;
    let deadZoneX = 0;
    let deadZoneY = 0;
    let pointerFollowRate = 28;
    let useOneEuro = true;
    let oneEuroMinCutoffX = 3.5;
    let oneEuroMinCutoffY = 3.5;
    let oneEuroBeta = 2.5;
    let oneEuroDCutoff = 1.0;
    let disconnectedAt = null;
    let lastDrawTime = performance.now();

    const EXPAND_TARGET_SCALE = 2.5;
    const EXPAND_SPRING_RATE = 12;
    const BURST_DURATION_MS = 1200;
    const BURST_PARTICLE_COUNT = 40;
    const AURA_EMBER_COUNT = 20;

    let expandActive = false;
    let auraActive = false;
    let radiusScale = 1;
    let bursts = [];
    let auraPhase = 0;

    class OneEuro {
      constructor({ minCutoff, beta, dCutoff }) {
        this.minCutoff = minCutoff;
        this.beta = beta;
        this.dCutoff = dCutoff;
        this.x = null;
        this.dx = 0;
        this.tPrev = null;
      }

      reset(value) {
        this.x = value ?? null;
        this.dx = 0;
        this.tPrev = null;
      }

      alpha(cutoff, dt) {
        const tau = 1 / (2 * Math.PI * cutoff);
        return 1 / (1 + tau / dt);
      }

      filter(value, t) {
        if (this.tPrev === null) {
          this.x = value;
          this.tPrev = t;
          return value;
        }
        const dt = Math.max((t - this.tPrev) / 1000, 1 / 120);
        this.tPrev = t;
        const aD = this.alpha(this.dCutoff, dt);
        const dx = (value - this.x) / dt;
        this.dx = aD * dx + (1 - aD) * this.dx;
        const cutoff = this.minCutoff + this.beta * Math.abs(this.dx);
        const a = this.alpha(cutoff, dt);
        this.x = a * value + (1 - a) * this.x;
        return this.x;
      }
    }

    const euroX = new OneEuro({ minCutoff: oneEuroMinCutoffX, beta: oneEuroBeta, dCutoff: oneEuroDCutoff });
    const euroY = new OneEuro({ minCutoff: oneEuroMinCutoffY, beta: oneEuroBeta, dCutoff: oneEuroDCutoff });

    function clamp(v, lo, hi) {
      return Math.min(hi, Math.max(lo, v));
    }

    function applyMicroDeadZone(delta, zone) {
      if (zone <= 0) return delta;
      const abs = Math.abs(delta);
      if (abs <= zone) return 0;
      return Math.sign(delta) * (abs - zone);
    }

    function smoothFollow(current, target, rate, dt) {
      const alpha = 1 - Math.exp(-rate * dt);
      return current + (target - current) * alpha;
    }

    function resetPointerToCenter() {
      pointerX = 0.5;
      pointerY = 0.5;
      euroX.reset(0.5);
      euroY.reset(0.5);
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(window.innerWidth * dpr);
      canvas.height = Math.round(window.innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function applySettings(settings) {
      if (!settings) return;
      sensX = settings.pointerSensitivityX ?? sensX;
      sensY = settings.pointerSensitivityY ?? sensY;
      invertX = settings.invertX ?? invertX;
      invertY = settings.invertY ?? invertY;
      deadZoneX = settings.deadZoneX ?? deadZoneX;
      deadZoneY = settings.deadZoneY ?? deadZoneY;
      pointerFollowRate = settings.pointerFollowRate ?? pointerFollowRate;
      useOneEuro = settings.useOneEuro ?? useOneEuro;
      oneEuroMinCutoffX = settings.oneEuroMinCutoffX ?? oneEuroMinCutoffX;
      oneEuroMinCutoffY = settings.oneEuroMinCutoffY ?? oneEuroMinCutoffY;
      oneEuroBeta = settings.oneEuroBeta ?? oneEuroBeta;
      oneEuroDCutoff = settings.oneEuroDCutoff ?? oneEuroDCutoff;
      euroX.minCutoff = oneEuroMinCutoffX;
      euroX.beta = oneEuroBeta;
      euroX.dCutoff = oneEuroDCutoff;
      euroY.minCutoff = oneEuroMinCutoffY;
      euroY.beta = oneEuroBeta;
      euroY.dCutoff = oneEuroDCutoff;
    }

    function computePointerFromOrientation(w, h) {
      if (!state || !state.isCalibrated || state.centerBeta == null) {
        return { x: w / 2, y: h / 2, pctX: 0.5, pctY: 0.5 };
      }

      const { panDeg, tiltDeg } = OrientationMap.computeDecoupledAnglesDeg(
        {
          alpha: orientation.alpha ?? 0,
          beta: orientation.beta,
          gamma: orientation.gamma,
        },
        {
          alpha: state.centerAlpha ?? 0,
          beta: state.centerBeta,
          gamma: state.centerGamma,
        }
      );

      const signX = invertX ? -1 : 1;
      const signY = invertY ? -1 : 1;
      const dx = applyMicroDeadZone(signX * panDeg, deadZoneX);
      const dy = applyMicroDeadZone(signY * tiltDeg, deadZoneY);

      const pctX = clamp(0.5 + dx * (sensX / w), 0, 1);
      const pctY = clamp(0.5 + dy * (sensY / h), 0, 1);
      return { x: pctX * w, y: pctY * h, pctX, pctY };
    }

    function renderViews() {
      const phoneUp = state && state.isPhoneConnected;
      const calibrated = state && state.isCalibrated;
      const wasLive = disconnectedAt !== null && calibrated;
      const showCanvas = phoneUp && calibrated;
      const needsCal = phoneUp && !calibrated;

      setupView.classList.toggle('visible', !phoneUp && !wasLive);
      calView.classList.toggle('visible', needsCal);
      calCrosshair.classList.toggle('visible', needsCal);
      canvas.style.display = showCanvas || wasLive ? 'block' : 'none';

      disconnectBanner.classList.toggle(
        'visible',
        wasLive && !phoneUp && performance.now() - disconnectedAt > DISCONNECT_HOLD_MS
      );
    }

    socket.on('init', ({ state: s, qrDataUrl, mobileUrl }) => {
      state = s;
      applySettings(s.settings);
      auraActive = !!s.auraActive;
      expandActive = !!s.expandActive;
      if (qrDataUrl) document.getElementById('qr-img').src = qrDataUrl;
      if (mobileUrl) document.getElementById('mobile-url').textContent = mobileUrl;
      if (s.isPhoneConnected) disconnectedAt = null;
      renderViews();
    });

    socket.on('orientation_update', (data) => {
      orientation = data;
    });

    socket.on('recenter', () => {
      resetPointerToCenter();
    });

    socket.on('state_update', (s) => {
      const wasConnected = state && state.isPhoneConnected;
      state = s;
      applySettings(s.settings);
      if (s.isPhoneConnected) disconnectedAt = null;
      else if (wasConnected) disconnectedAt = performance.now();
      renderViews();
    });

    socket.on('state_update', (s) => {
      const wasConnected = state && state.isPhoneConnected;
      state = s;
      applySettings(s.settings);
      auraActive = !!s.auraActive;
      if (!s.isPhoneConnected) expandActive = false;
      else expandActive = !!s.expandActive;
      if (s.isPhoneConnected) disconnectedAt = null;
      else if (wasConnected) disconnectedAt = performance.now();
      renderViews();
    });

    socket.on('effect_burst', () => {
      if (currentX === null || currentY === null) return;
      spawnBurst(currentX, currentY, performance.now());
    });

    socket.on('effect_expand', ({ active }) => {
      expandActive = !!active;
    });

    socket.on('effect_aura', ({ active }) => {
      auraActive = !!active;
    });

    function spawnBurst(x, y, now) {
      const particles = [];
      for (let i = 0; i < BURST_PARTICLE_COUNT; i++) {
        const angle = (Math.PI * 2 * i) / BURST_PARTICLE_COUNT + (Math.random() - 0.5) * 0.4;
        const speed = 180 + Math.random() * 320;
        particles.push({
          angle,
          speed,
          size: 2 + Math.random() * 4,
          life: 0.6 + Math.random() * 0.4,
        });
      }
      bursts.push({ x, y, startTime: now, particles });
    }

    function cullBursts(now) {
      bursts = bursts.filter((b) => now - b.startTime < BURST_DURATION_MS);
    }

    function baseRadius(w, h) {
      return Math.min(w, h) * 0.22;
    }

    function drawAura(x, y, w, h, now, intensity) {
      auraPhase += 0.016;
      const breath = 0.85 + Math.sin(auraPhase * 1.8) * 0.15;
      const r = baseRadius(w, h) * radiusScale * (1.8 + breath * 0.5);

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';

      const halo = ctx.createRadialGradient(x, y, r * 0.15, x, y, r);
      halo.addColorStop(0, `rgba(255, 240, 210, ${0.12 * intensity})`);
      halo.addColorStop(0.45, `rgba(255, 220, 180, ${0.08 * intensity})`);
      halo.addColorStop(0.75, `rgba(200, 180, 255, ${0.04 * intensity})`);
      halo.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();

      const ring = ctx.createRadialGradient(x, y, r * 0.72, x, y, r * 0.95);
      ring.addColorStop(0, 'rgba(255, 255, 255, 0)');
      ring.addColorStop(0.5, `rgba(255, 255, 255, ${0.18 * intensity * breath})`);
      ring.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = ring;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();

      for (let i = 0; i < AURA_EMBER_COUNT; i++) {
        const phase = auraPhase * (0.6 + (i % 5) * 0.08) + i * 1.37;
        const orbit = r * (0.55 + (i % 7) * 0.06);
        const ex = x + Math.cos(phase) * orbit;
        const ey = y + Math.sin(phase * 1.13) * orbit * 0.85;
        const emberAlpha = (0.25 + Math.sin(phase * 2.1) * 0.15) * intensity;
        const emberR = 1.5 + (i % 3) * 0.8;
        const ember = ctx.createRadialGradient(ex, ey, 0, ex, ey, emberR * 3);
        ember.addColorStop(0, `rgba(255, 230, 200, ${emberAlpha})`);
        ember.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = ember;
        ctx.beginPath();
        ctx.arc(ex, ey, emberR * 3, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawBursts(w, h, now, intensity) {
      if (!bursts.length) return;

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';

      for (const burst of bursts) {
        const elapsed = now - burst.startTime;
        const t = elapsed / BURST_DURATION_MS;
        if (t >= 1) continue;

        const flash = Math.max(0, 1 - elapsed / 180);
        if (flash > 0) {
          ctx.fillStyle = `rgba(255, 255, 255, ${flash * 0.35 * intensity})`;
          ctx.fillRect(0, 0, w, h);
        }

        const ringR = 40 + elapsed * 0.55;
        const ringAlpha = Math.max(0, (1 - t * 1.1) * 0.85 * intensity);
        ctx.strokeStyle = `rgba(255, 255, 255, ${ringAlpha})`;
        ctx.lineWidth = 3 + (1 - t) * 8;
        ctx.beginPath();
        ctx.arc(burst.x, burst.y, ringR, 0, Math.PI * 2);
        ctx.stroke();

        const ring2Alpha = Math.max(0, (1 - t * 1.3) * 0.5 * intensity);
        ctx.strokeStyle = `rgba(255, 220, 180, ${ring2Alpha})`;
        ctx.lineWidth = 1 + (1 - t) * 4;
        ctx.beginPath();
        ctx.arc(burst.x, burst.y, ringR * 0.65, 0, Math.PI * 2);
        ctx.stroke();

        for (const p of burst.particles) {
          const lifeT = elapsed / (BURST_DURATION_MS * p.life);
          if (lifeT >= 1) continue;
          const dist = p.speed * (elapsed / 1000);
          const px = burst.x + Math.cos(p.angle) * dist;
          const py = burst.y + Math.sin(p.angle) * dist;
          const pAlpha = Math.max(0, (1 - lifeT) * intensity);
          const spark = ctx.createRadialGradient(px, py, 0, px, py, p.size * 2);
          spark.addColorStop(0, `rgba(255, 255, 255, ${pAlpha})`);
          spark.addColorStop(0.4, `rgba(255, 230, 200, ${pAlpha * 0.6})`);
          spark.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = spark;
          ctx.beginPath();
          ctx.arc(px, py, p.size * 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.restore();
    }

    function drawSpot(x, y, w, h, intensity, scale) {
      const radius = baseRadius(w, h) * scale;
      const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
      g.addColorStop(0.0, `rgba(255, 255, 255, ${intensity})`);
      g.addColorStop(0.5, `rgba(255, 255, 255, ${0.85 * intensity})`);
      g.addColorStop(0.8, `rgba(255, 255, 255, ${0.25 * intensity})`);
      g.addColorStop(1.0, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw(now) {
      requestAnimationFrame(draw);

      const dt = Math.min(Math.max((now - lastDrawTime) / 1000, 1 / 240), 0.05);
      lastDrawTime = now;

      const w = window.innerWidth;
      const h = window.innerHeight;
      const aimed = computePointerFromOrientation(w, h);
      let targetPctX = aimed.pctX;
      let targetPctY = aimed.pctY;

      if (useOneEuro) {
        targetPctX = clamp(euroX.filter(targetPctX, now), 0, 1);
        targetPctY = clamp(euroY.filter(targetPctY, now), 0, 1);
      }

      pointerX = targetPctX;
      pointerY = targetPctY;

      if (isTestMode) {
        window.__spotlightTestHook = {
          currentX,
          currentY,
          pointerX,
          pointerY,
          canvasVisible: canvas.style.display !== 'none',
          isCalibrated: state && state.isCalibrated,
        };
      }

      if (canvas.style.display === 'none') return;

      let targetX = pointerX * w;
      let targetY = pointerY * h;

      if (disconnectedAt !== null) {
        targetX = currentX ?? w / 2;
        targetY = currentY ?? h / 2;
        renderViews();
      }

      if (currentX === null) currentX = targetX;
      if (currentY === null) currentY = targetY;

      currentX = clamp(smoothFollow(currentX, targetX, pointerFollowRate, dt), 0, w);
      currentY = clamp(smoothFollow(currentY, targetY, pointerFollowRate, dt), 0, h);

      const expandTarget = expandActive ? EXPAND_TARGET_SCALE : 1;
      radiusScale = smoothFollow(radiusScale, expandTarget, EXPAND_SPRING_RATE, dt);

      cullBursts(now);

      let intensity = 1;
      if (disconnectedAt !== null) {
        const sinceDrop = now - disconnectedAt;
        if (sinceDrop > DISCONNECT_HOLD_MS) {
          intensity = clamp(1 - (sinceDrop - DISCONNECT_HOLD_MS) / FADE_DURATION_MS, 0, 1);
        }
      }

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, w, h);

      if (intensity > 0) {
        drawBursts(w, h, now, intensity);
        if (auraActive) drawAura(currentX, currentY, w, h, now, intensity);
        drawSpot(currentX, currentY, w, h, intensity, radiusScale);
      }

      if (isTestMode) {
        window.__spotlightTestHook = {
          currentX,
          currentY,
          pointerX,
          pointerY,
          canvasVisible: canvas.style.display !== 'none',
          isCalibrated: state && state.isCalibrated,
          radiusScale,
          activeBurstCount: bursts.length,
          auraActive,
          expandActive,
        };
      }
    }
    requestAnimationFrame(draw);
  </script>
</body>
</html>
