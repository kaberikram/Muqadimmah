<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gamepad Spotlight</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }

    #spotlight-canvas {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      display: none;
    }

    #connect-view {
      position: fixed; inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      background: #000;
      color: #fff;
      text-align: center;
      padding: 2rem;
      cursor: default;
    }
    #connect-view.hidden { display: none; }
    #connect-view .icon { font-size: clamp(4rem, 12vw, 8rem); }
    #connect-view h1 { font-size: clamp(1.5rem, 4vw, 2.5rem); font-weight: 600; }
    #connect-view p  { font-size: clamp(0.95rem, 2vw, 1.2rem); color: #999; max-width: 42rem; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="connect-view">
    <div class="icon">🎮</div>
    <h1>Connect a Controller</h1>
    <p>Plug in or pair a gamepad, then <strong style="color:#fff">press any button</strong> to start.</p>
    <p style="color:#666;font-size:0.9rem;">
      Left stick moves the spotlight &middot; A&nbsp;Burst &middot; X&nbsp;(hold)&nbsp;Expand &middot; B&nbsp;Aura &middot; Y&nbsp;Recenter
    </p>
  </div>

  <canvas id="spotlight-canvas"></canvas>

  <script>
    'use strict';

    const isTestMode = new URLSearchParams(window.location.search).get('test') === '1';

    const connectView = document.getElementById('connect-view');
    const canvas = document.getElementById('spotlight-canvas');
    const ctx = canvas.getContext('2d');

    // ---- Tunables --------------------------------------------------------
    const MOVE_SPEED = 1.1;       // full-deflection travel, screen-fractions/sec
    const STICK_DEADZONE = 0.12;  // radial dead zone (drift rejection)
    const STICK_EXPO = 1.6;       // >1 = finer control near center
    const INVERT_Y = false;       // flip if your controller's Y axis feels backwards
    const FOLLOW_RATE = 28;       // spotlight easing toward the pointer

    // Standard gamepad mapping (Xbox layout)
    const BTN_BURST = 0;    // A
    const BTN_AURA = 1;     // B
    const BTN_EXPAND = 2;   // X (hold)
    const BTN_RECENTER = 3; // Y

    const EXPAND_TARGET_SCALE = 2.5;
    const EXPAND_SPRING_RATE = 12;
    const BURST_DURATION_MS = 1200;
    const BURST_PARTICLE_COUNT = 40;
    const AURA_EMBER_COUNT = 20;

    // ---- State -----------------------------------------------------------
    let pointerX = 0.5;
    let pointerY = 0.5;
    let currentX = null;
    let currentY = null;
    let lastDrawTime = performance.now();

    let gamepadConnected = false;
    let prevButtons = [];

    let expandActive = false;
    let auraActive = false;
    let radiusScale = 1;
    let bursts = [];
    let auraPhase = 0;

    function clamp(v, lo, hi) {
      return Math.min(hi, Math.max(lo, v));
    }

    function smoothFollow(current, target, rate, dt) {
      const alpha = 1 - Math.exp(-rate * dt);
      return current + (target - current) * alpha;
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(window.innerWidth * dpr);
      canvas.height = Math.round(window.innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ---- Gamepad input ---------------------------------------------------
    function activeGamepad() {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      for (const gp of pads) {
        if (gp && gp.connected) return gp;
      }
      return null;
    }

    function applyStickCurve(ax, ay) {
      const mag = Math.hypot(ax, ay);
      if (mag < STICK_DEADZONE) return { x: 0, y: 0 };
      const scaled = Math.pow((mag - STICK_DEADZONE) / (1 - STICK_DEADZONE), STICK_EXPO);
      return { x: (ax / mag) * scaled, y: (ay / mag) * scaled };
    }

    function readGamepad(dt, now) {
      const gp = activeGamepad();
      const wasConnected = gamepadConnected;
      gamepadConnected = !!gp;
      if (gamepadConnected !== wasConnected) renderViews();
      if (!gp) {
        prevButtons = [];
        return;
      }

      const stick = applyStickCurve(gp.axes[0] || 0, gp.axes[1] || 0);
      const ySign = INVERT_Y ? -1 : 1;
      pointerX = clamp(pointerX + stick.x * MOVE_SPEED * dt, 0, 1);
      pointerY = clamp(pointerY + stick.y * ySign * MOVE_SPEED * dt, 0, 1);

      const pressed = (i) => !!(gp.buttons[i] && gp.buttons[i].pressed);
      const edge = (i) => pressed(i) && !prevButtons[i];

      if (edge(BTN_BURST)) {
        const w = window.innerWidth;
        const h = window.innerHeight;
        spawnBurst(currentX ?? pointerX * w, currentY ?? pointerY * h, now);
      }
      expandActive = pressed(BTN_EXPAND);
      if (edge(BTN_AURA)) auraActive = !auraActive;
      if (edge(BTN_RECENTER)) {
        pointerX = 0.5;
        pointerY = 0.5;
      }

      prevButtons = gp.buttons.map((b) => b.pressed);
    }

    function renderViews() {
      connectView.classList.toggle('hidden', gamepadConnected);
      canvas.style.display = gamepadConnected ? 'block' : 'none';
    }

    window.addEventListener('gamepadconnected', () => {
      gamepadConnected = true;
      renderViews();
    });
    window.addEventListener('gamepaddisconnected', () => {
      gamepadConnected = !!activeGamepad();
      renderViews();
    });

    // ---- Effects ---------------------------------------------------------
    function spawnBurst(x, y, now) {
      const particles = [];
      for (let i = 0; i < BURST_PARTICLE_COUNT; i++) {
        const angle = (Math.PI * 2 * i) / BURST_PARTICLE_COUNT + (Math.random() - 0.5) * 0.4;
        const speed = 180 + Math.random() * 320;
        particles.push({
          angle,
          speed,
          size: 2 + Math.random() * 4,
          life: 0.6 + Math.random() * 0.4,
        });
      }
      bursts.push({ x, y, startTime: now, particles });
    }

    function cullBursts(now) {
      bursts = bursts.filter((b) => now - b.startTime < BURST_DURATION_MS);
    }

    function baseRadius(w, h) {
      return Math.min(w, h) * 0.22;
    }

    function drawAura(x, y, w, h, now, intensity) {
      auraPhase += 0.016;
      const breath = 0.85 + Math.sin(auraPhase * 1.8) * 0.15;
      const r = baseRadius(w, h) * radiusScale * (1.8 + breath * 0.5);

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';

      const halo = ctx.createRadialGradient(x, y, r * 0.15, x, y, r);
      halo.addColorStop(0, `rgba(255, 240, 210, ${0.12 * intensity})`);
      halo.addColorStop(0.45, `rgba(255, 220, 180, ${0.08 * intensity})`);
      halo.addColorStop(0.75, `rgba(200, 180, 255, ${0.04 * intensity})`);
      halo.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();

      const ring = ctx.createRadialGradient(x, y, r * 0.72, x, y, r * 0.95);
      ring.addColorStop(0, 'rgba(255, 255, 255, 0)');
      ring.addColorStop(0.5, `rgba(255, 255, 255, ${0.18 * intensity * breath})`);
      ring.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = ring;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();

      for (let i = 0; i < AURA_EMBER_COUNT; i++) {
        const phase = auraPhase * (0.6 + (i % 5) * 0.08) + i * 1.37;
        const orbit = r * (0.55 + (i % 7) * 0.06);
        const ex = x + Math.cos(phase) * orbit;
        const ey = y + Math.sin(phase * 1.13) * orbit * 0.85;
        const emberAlpha = (0.25 + Math.sin(phase * 2.1) * 0.15) * intensity;
        const emberR = 1.5 + (i % 3) * 0.8;
        const ember = ctx.createRadialGradient(ex, ey, 0, ex, ey, emberR * 3);
        ember.addColorStop(0, `rgba(255, 230, 200, ${emberAlpha})`);
        ember.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = ember;
        ctx.beginPath();
        ctx.arc(ex, ey, emberR * 3, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawBursts(w, h, now, intensity) {
      if (!bursts.length) return;

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';

      for (const burst of bursts) {
        const elapsed = now - burst.startTime;
        const t = elapsed / BURST_DURATION_MS;
        if (t >= 1) continue;

        const flash = Math.max(0, 1 - elapsed / 180);
        if (flash > 0) {
          ctx.fillStyle = `rgba(255, 255, 255, ${flash * 0.35 * intensity})`;
          ctx.fillRect(0, 0, w, h);
        }

        const ringR = 40 + elapsed * 0.55;
        const ringAlpha = Math.max(0, (1 - t * 1.1) * 0.85 * intensity);
        ctx.strokeStyle = `rgba(255, 255, 255, ${ringAlpha})`;
        ctx.lineWidth = 3 + (1 - t) * 8;
        ctx.beginPath();
        ctx.arc(burst.x, burst.y, ringR, 0, Math.PI * 2);
        ctx.stroke();

        const ring2Alpha = Math.max(0, (1 - t * 1.3) * 0.5 * intensity);
        ctx.strokeStyle = `rgba(255, 220, 180, ${ring2Alpha})`;
        ctx.lineWidth = 1 + (1 - t) * 4;
        ctx.beginPath();
        ctx.arc(burst.x, burst.y, ringR * 0.65, 0, Math.PI * 2);
        ctx.stroke();

        for (const p of burst.particles) {
          const lifeT = elapsed / (BURST_DURATION_MS * p.life);
          if (lifeT >= 1) continue;
          const dist = p.speed * (elapsed / 1000);
          const px = burst.x + Math.cos(p.angle) * dist;
          const py = burst.y + Math.sin(p.angle) * dist;
          const pAlpha = Math.max(0, (1 - lifeT) * intensity);
          const spark = ctx.createRadialGradient(px, py, 0, px, py, p.size * 2);
          spark.addColorStop(0, `rgba(255, 255, 255, ${pAlpha})`);
          spark.addColorStop(0.4, `rgba(255, 230, 200, ${pAlpha * 0.6})`);
          spark.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = spark;
          ctx.beginPath();
          ctx.arc(px, py, p.size * 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.restore();
    }

    function drawSpot(x, y, w, h, intensity, scale) {
      const radius = baseRadius(w, h) * scale;
      const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
      g.addColorStop(0.0, `rgba(255, 255, 255, ${intensity})`);
      g.addColorStop(0.5, `rgba(255, 255, 255, ${0.85 * intensity})`);
      g.addColorStop(0.8, `rgba(255, 255, 255, ${0.25 * intensity})`);
      g.addColorStop(1.0, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
    }

    // ---- Main loop -------------------------------------------------------
    function publishTestHook() {
      window.__spotlightTestHook = {
        currentX,
        currentY,
        pointerX,
        pointerY,
        canvasVisible: canvas.style.display !== 'none',
        gamepadConnected,
        radiusScale,
        activeBurstCount: bursts.length,
        auraActive,
        expandActive,
      };
    }

    function draw(now) {
      requestAnimationFrame(draw);

      const dt = Math.min(Math.max((now - lastDrawTime) / 1000, 1 / 240), 0.05);
      lastDrawTime = now;

      readGamepad(dt, now);

      if (isTestMode) publishTestHook();
      if (!gamepadConnected) return;

      const w = window.innerWidth;
      const h = window.innerHeight;
      const targetX = pointerX * w;
      const targetY = pointerY * h;

      if (currentX === null) currentX = targetX;
      if (currentY === null) currentY = targetY;

      currentX = clamp(smoothFollow(currentX, targetX, FOLLOW_RATE, dt), 0, w);
      currentY = clamp(smoothFollow(currentY, targetY, FOLLOW_RATE, dt), 0, h);

      const expandTarget = expandActive ? EXPAND_TARGET_SCALE : 1;
      radiusScale = smoothFollow(radiusScale, expandTarget, EXPAND_SPRING_RATE, dt);

      cullBursts(now);

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, w, h);

      drawBursts(w, h, now, 1);
      if (auraActive) drawAura(currentX, currentY, w, h, now, 1);
      drawSpot(currentX, currentY, w, h, 1, radiusScale);

      if (isTestMode) publishTestHook();
    }

    renderViews();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
