<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gyro Spotlight — Projector</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    #spotlight-canvas {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      display: none;
    }

    .overlay {
      position: fixed; inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      background: #000;
      color: #fff;
      text-align: center;
      cursor: default;
    }
    .overlay.visible { display: flex; }

    #qr-img {
      width: min(60vh, 60vw);
      height: min(60vh, 60vw);
      background: #fff;
      padding: 1.5rem;
      border-radius: 1rem;
      image-rendering: pixelated;
    }
    .overlay h1 { font-size: clamp(1.5rem, 4vw, 3rem); font-weight: 600; letter-spacing: 0.02em; }
    .overlay p  { font-size: clamp(1rem, 2vw, 1.4rem); color: #999; }

    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    #disconnect-banner {
      position: fixed; top: 2rem; left: 50%;
      transform: translateX(-50%);
      background: rgba(180, 30, 30, 0.9);
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-size: 1.1rem;
      display: none;
    }
    #disconnect-banner.visible { display: block; }
  </style>
</head>
<body>
  <!-- State 1: pairing -->
  <div id="setup-view" class="overlay visible">
    <img id="qr-img" alt="QR code to pair phone" />
    <h1>Scan with iPhone to Pair.</h1>
    <p id="mobile-url"></p>
  </div>

  <!-- State 2: waiting for calibration -->
  <div id="calibration-view" class="overlay">
    <h1 class="pulse">Waiting for Artist Calibration&hellip;</h1>
    <p>On the phone: face stage-left, tap &ldquo;Set Left Boundary&rdquo;, then face stage-right and tap &ldquo;Set Right Boundary&rdquo;.</p>
  </div>

  <!-- State 3: live performance -->
  <canvas id="spotlight-canvas"></canvas>
  <div id="disconnect-banner">Connection lost &mdash; waiting for phone&hellip;</div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    'use strict';

    const socket = io();

    const setupView = document.getElementById('setup-view');
    const calibrationView = document.getElementById('calibration-view');
    const canvas = document.getElementById('spotlight-canvas');
    const disconnectBanner = document.getElementById('disconnect-banner');
    const ctx = canvas.getContext('2d');

    // Hold the spotlight at its last position this long after the phone
    // drops before fading out — a mid-show blip shouldn't kill the light.
    const DISCONNECT_HOLD_MS = 5000;
    const FADE_DURATION_MS = 1000;

    let state = null;             // latest server state snapshot
    let currentAngle = 0;         // latest raw angle from the phone
    let currentX = null;          // smoothed spotlight position (null = uninitialized)
    let smoothingFactor = 0.1;
    let disconnectedAt = null;    // timestamp of phone disconnect, null while connected

    /** Signed shortest-arc difference a - b, normalized to [-180, 180). */
    function angleDiff(a, b) {
      return ((a - b + 540) % 360) - 180;
    }

    function clamp(v, lo, hi) {
      return Math.min(hi, Math.max(lo, v));
    }

    // ------------------------------------------------------------------
    // Canvas sizing (devicePixelRatio-aware so the gradient stays crisp)
    // ------------------------------------------------------------------
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(window.innerWidth * dpr);
      canvas.height = Math.round(window.innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ------------------------------------------------------------------
    // UI state machine
    // ------------------------------------------------------------------
    function renderViews() {
      const phoneUp = state && state.isPhoneConnected;
      const calibrated = state && state.calibration.isCalibrated;

      // Live mode persists through a disconnect (the hold-and-fade path);
      // only fall back to the QR screen if we were never calibrated.
      const live = calibrated && (phoneUp || disconnectedAt !== null);

      setupView.classList.toggle('visible', !phoneUp && !live);
      calibrationView.classList.toggle('visible', phoneUp && !calibrated);
      canvas.style.display = live ? 'block' : 'none';
      disconnectBanner.classList.toggle(
        'visible',
        live && !phoneUp && disconnectedAt !== null &&
          performance.now() - disconnectedAt > DISCONNECT_HOLD_MS
      );
    }

    // ------------------------------------------------------------------
    // Socket wiring
    // ------------------------------------------------------------------
    socket.on('init', ({ state: s, qrDataUrl, mobileUrl }) => {
      state = s;
      currentAngle = s.currentAngle;
      smoothingFactor = s.settings.smoothingFactor;
      if (qrDataUrl) document.getElementById('qr-img').src = qrDataUrl;
      if (mobileUrl) document.getElementById('mobile-url').textContent = mobileUrl;
      if (s.isPhoneConnected) disconnectedAt = null;
      renderViews();
    });

    socket.on('state_update', (s) => {
      const wasConnected = state && state.isPhoneConnected;
      state = s;
      smoothingFactor = s.settings.smoothingFactor;

      if (s.isPhoneConnected) {
        disconnectedAt = null;
      } else if (wasConnected) {
        disconnectedAt = performance.now();
      }
      renderViews();
    });

    socket.on('gyro_update', (angle) => {
      currentAngle = angle;
    });

    // ------------------------------------------------------------------
    // Render loop: lerp mapping + exponential smoothing + spotlight draw
    // ------------------------------------------------------------------
    function draw(now) {
      requestAnimationFrame(draw);
      if (canvas.style.display === 'none') return;

      const w = window.innerWidth;
      const h = window.innerHeight;

      let targetX = currentX === null ? w / 2 : currentX;
      if (state && state.calibration.isCalibrated) {
        const { leftAngle, rightAngle } = state.calibration;
        // Shortest-arc ratio: continuous across the 0°/360° seam, and if the
        // right boundary sits "below" the left one both diffs flip sign, so
        // stage-left always lands at x=0 without a special case.
        const span = angleDiff(rightAngle, leftAngle);
        const pct = clamp(angleDiff(currentAngle, leftAngle) / span, 0, 1);
        targetX = clamp(pct * w, 0, w);
      }

      // While disconnected, freeze on the last known position.
      if (disconnectedAt !== null) {
        targetX = currentX === null ? w / 2 : currentX;
        renderViews(); // keeps the banner timer honest without a setTimeout
      }

      if (currentX === null) currentX = targetX;
      currentX += (targetX - currentX) * smoothingFactor;

      // After the hold window, fade the spotlight out over FADE_DURATION_MS.
      let intensity = 1;
      if (disconnectedAt !== null) {
        const sinceDrop = now - disconnectedAt;
        if (sinceDrop > DISCONNECT_HOLD_MS) {
          intensity = clamp(1 - (sinceDrop - DISCONNECT_HOLD_MS) / FADE_DURATION_MS, 0, 1);
        }
      }

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, w, h);

      if (intensity > 0) {
        const cy = h / 2;
        const radius = h * 0.3;
        const g = ctx.createRadialGradient(currentX, cy, 0, currentX, cy, radius);
        g.addColorStop(0.0, `rgba(255, 255, 255, ${intensity})`);
        g.addColorStop(0.5, `rgba(255, 255, 255, ${0.85 * intensity})`);
        g.addColorStop(0.8, `rgba(255, 255, 255, ${0.25 * intensity})`);
        g.addColorStop(1.0, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(currentX, cy, radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    requestAnimationFrame(draw);
  </script>
</body>
</html>
