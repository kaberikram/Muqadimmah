<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gyro Spotlight — Projector</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }

    #spotlight-canvas {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      display: none;
    }

    .overlay {
      position: fixed; inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      background: #000;
      color: #fff;
      text-align: center;
      padding: 2rem;
      cursor: default;
    }
    .overlay.visible { display: flex; }

    #qr-img {
      width: min(60vh, 60vw);
      height: min(60vh, 60vw);
      background: #fff;
      padding: 1.5rem;
      border-radius: 1rem;
    }
    .overlay h1 { font-size: clamp(1.5rem, 4vw, 2.5rem); font-weight: 600; }
    .overlay p  { font-size: clamp(0.95rem, 2vw, 1.2rem); color: #999; max-width: 42rem; line-height: 1.5; }
    .overlay .operator-url { color: #666; font-size: 0.9rem; font-family: ui-monospace, monospace; }

    #disconnect-banner {
      position: fixed; top: 2rem; left: 50%;
      transform: translateX(-50%);
      background: rgba(180, 30, 30, 0.9);
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-size: 1.1rem;
      display: none;
    }
    #disconnect-banner.visible { display: block; }

    #mode-badge {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      background: rgba(255, 255, 255, 0.08);
      color: #666;
      padding: 0.4rem 0.8rem;
      border-radius: 0.4rem;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      display: none;
    }
    #mode-badge.visible { display: block; }
  </style>
</head>
<body>
  <div id="setup-view" class="overlay visible">
    <img id="qr-img" alt="QR code to pair phone" />
    <h1>Scan with iPhone to Pair</h1>
    <p id="mobile-url"></p>
    <p class="operator-url">Operator calibrates at: <span id="operator-url"></span></p>
  </div>

  <div id="pointer-cal-view" class="overlay">
    <h1>Pointer Calibration</h1>
    <p>On the phone: aim at screen center and tap &ldquo;Set Screen Center&rdquo;.</p>
  </div>

  <canvas id="spotlight-canvas"></canvas>
  <div id="disconnect-banner">Connection lost &mdash; waiting for phone&hellip;</div>
  <div id="mode-badge"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    'use strict';

    const socket = io();
    const isTestMode = new URLSearchParams(window.location.search).get('test') === '1';

    const setupView = document.getElementById('setup-view');
    const pointerCalView = document.getElementById('pointer-cal-view');
    const canvas = document.getElementById('spotlight-canvas');
    const disconnectBanner = document.getElementById('disconnect-banner');
    const modeBadge = document.getElementById('mode-badge');
    const ctx = canvas.getContext('2d');

    const DISCONNECT_HOLD_MS = 5000;
    const FADE_DURATION_MS = 1000;
    const MAX_ALPHA_JUMP_DEG = 20;

    let state = null;
    let orientation = { alpha: 0, beta: 90, gamma: 0, rotationRate: null, t: null, still: false, omega: 0, v: 1 };
    let currentX = null;
    let currentY = null;
    let smoothingFactor = 0.1;
    let gyroCorrectionGain = 0.03;
    let sensX = 50;
    let sensY = 40;
    let fusionTauBase = 0.5;
    let fusionTauStill = 0.15;
    let fusionTauFast = 1.5;
    let fastRotThresholdDps = 50;
    let useOneEuro = true;
    let oneEuroMinCutoff = 0.6;
    let oneEuroBeta = 1.2;
    let oneEuroDCutoff = 1.0;
    let disconnectedAt = null;
    let filteredAlpha = null;
    let fusedValue = null;
    let lastPacketT = null;
    let packetFusionActive = false;
    let stillPct = null;
    let lastRenderedPct = 0.5;
    let lastFrameTime = null;

    class OneEuro {
      constructor({ minCutoff, beta, dCutoff }) {
        this.minCutoff = minCutoff;
        this.beta = beta;
        this.dCutoff = dCutoff;
        this.x = null;
        this.dx = 0;
        this.tPrev = null;
      }

      reset() {
        this.x = null;
        this.dx = 0;
        this.tPrev = null;
      }

      alpha(cutoff, dt) {
        const tau = 1 / (2 * Math.PI * cutoff);
        return 1 / (1 + tau / dt);
      }

      filter(value, t) {
        if (this.tPrev === null) {
          this.x = value;
          this.tPrev = t;
          return value;
        }
        const dt = Math.max((t - this.tPrev) / 1000, 1 / 120);
        this.tPrev = t;
        const aD = this.alpha(this.dCutoff, dt);
        const dx = (value - this.x) / dt;
        this.dx = aD * dx + (1 - aD) * this.dx;
        const cutoff = this.minCutoff + this.beta * Math.abs(this.dx);
        const a = this.alpha(cutoff, dt);
        this.x = a * value + (1 - a) * this.x;
        return this.x;
      }
    }

    const stageEuro = new OneEuro({ minCutoff: oneEuroMinCutoff, beta: oneEuroBeta, dCutoff: oneEuroDCutoff });

    function angleDiff(a, b) {
      return ((a - b + 540) % 360) - 180;
    }

    function clamp(v, lo, hi) {
      return Math.min(hi, Math.max(lo, v));
    }

    function axisDelta(axis, a, b) {
      return axis === 'alpha' ? angleDiff(a, b) : a - b;
    }

    function resetTrackingState() {
      filteredAlpha = null;
      fusedValue = null;
      lastPacketT = null;
      packetFusionActive = false;
      stillPct = null;
      stageEuro.reset();
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(window.innerWidth * dpr);
      canvas.height = Math.round(window.innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function applySettings(settings) {
      if (!settings) return;
      const mode = state && state.trackingMode;
      smoothingFactor = mode === 'pointer'
        ? (settings.pointerSmoothingFactor ?? smoothingFactor)
        : (settings.stageSmoothingFactor ?? smoothingFactor);
      gyroCorrectionGain = settings.gyroCorrectionGain ?? gyroCorrectionGain;
      sensX = settings.pointerSensitivityX ?? sensX;
      sensY = settings.pointerSensitivityY ?? sensY;
      fusionTauBase = settings.fusionTauBase ?? fusionTauBase;
      fusionTauStill = settings.fusionTauStill ?? fusionTauStill;
      fusionTauFast = settings.fusionTauFast ?? fusionTauFast;
      fastRotThresholdDps = settings.fastRotThresholdDps ?? fastRotThresholdDps;
      useOneEuro = settings.useOneEuro ?? useOneEuro;
      oneEuroMinCutoff = settings.oneEuroMinCutoff ?? oneEuroMinCutoff;
      oneEuroBeta = settings.oneEuroBeta ?? oneEuroBeta;
      oneEuroDCutoff = settings.oneEuroDCutoff ?? oneEuroDCutoff;
      stageEuro.minCutoff = oneEuroMinCutoff;
      stageEuro.beta = oneEuroBeta;
      stageEuro.dCutoff = oneEuroDCutoff;
    }

    function currentFusionTau(still, omega) {
      if (still) return fusionTauStill;
      if (omega > fastRotThresholdDps) return fusionTauFast;
      return fusionTauBase;
    }

    function filterStageAlpha(alpha) {
      if (filteredAlpha === null) {
        filteredAlpha = alpha;
        return alpha;
      }
      if (Math.abs(angleDiff(alpha, filteredAlpha)) > MAX_ALPHA_JUMP_DEG) return filteredAlpha;
      filteredAlpha = alpha;
      return alpha;
    }

    function mapMultiPointToPct(value, points, axis) {
      const pts = points.filter((p) => p.snapshot);
      if (pts.length < 2) return 0.5;

      function val(p) { return p.snapshot[axis]; }

      for (let i = 0; i < pts.length - 1; i++) {
        const v0 = val(pts[i]);
        const v1 = val(pts[i + 1]);
        const span = axisDelta(axis, v1, v0);
        if (Math.abs(span) < 0.001) continue;
        const t = axisDelta(axis, value, v0) / span;
        if (t >= 0 && t <= 1) {
          return pts[i].pct + t * (pts[i + 1].pct - pts[i].pct);
        }
      }

      const v0 = val(pts[0]);
      const v1 = val(pts[1]);
      const span0 = axisDelta(axis, v1, v0);
      const pos0 = axisDelta(axis, value, v0);
      if (Math.abs(span0) >= 0.001 && Math.sign(pos0) !== Math.sign(span0)) {
        return clamp(pts[0].pct + (pos0 / span0) * (pts[1].pct - pts[0].pct), 0, 1);
      }

      const last = pts.length - 1;
      const spanL = axisDelta(axis, val(pts[last]), val(pts[last - 1]));
      const posL = axisDelta(axis, value, val(pts[last - 1]));
      return clamp(pts[last - 1].pct + (posL / spanL) * (pts[last].pct - pts[last - 1].pct), 0, 1);
    }

    function applyStageOffset(pct) {
      return clamp(pct + (state && state.stageOffsetPct ? state.stageOffsetPct : 0), 0, 1);
    }

    function fuseOnPacket(data) {
      const cal = state && state.calibration;
      if (!cal || state.trackingMode !== 'stage') return;

      const axis = cal.mappingAxis || 'alpha';
      const compass = data[axis];
      const rate = data.rotationRate && data.rotationRate[axis];

      if (typeof data.t !== 'number' || !Number.isFinite(data.t)) {
        packetFusionActive = false;
        return;
      }

      packetFusionActive = true;
      const dtS = lastPacketT === null
        ? 0
        : clamp((data.t - lastPacketT) / 1000, 0, 0.1);
      lastPacketT = data.t;

      if (fusedValue === null) fusedValue = compass;

      if (rate != null && dtS > 0) {
        fusedValue += rate * dtS;
      }

      if (dtS > 0) {
        const pull = 1 - Math.exp(-dtS / currentFusionTau(data.still, data.omega || 0));
        if (axis === 'alpha') {
          fusedValue = (fusedValue + angleDiff(compass, fusedValue) * pull + 360) % 360;
        } else {
          fusedValue += (compass - fusedValue) * pull;
        }
      } else if (fusedValue === null) {
        fusedValue = compass;
      }
    }

    function getStageTrackingValue(axis, dt) {
      const compass = orientation[axis];
      const rate = orientation.rotationRate && orientation.rotationRate[axis];

      if (packetFusionActive && fusedValue !== null) {
        return axis === 'alpha' ? filterStageAlpha(fusedValue) : fusedValue;
      }

      if (rate == null || dt == null || dt <= 0) {
        fusedValue = compass;
        return axis === 'alpha' ? filterStageAlpha(compass) : compass;
      }

      if (fusedValue === null) fusedValue = compass;
      fusedValue += rate * dt;
      if (axis === 'alpha') {
        fusedValue = (fusedValue + angleDiff(compass, fusedValue) * gyroCorrectionGain + 360) % 360;
        return filterStageAlpha(fusedValue);
      }
      fusedValue += (compass - fusedValue) * gyroCorrectionGain;
      return fusedValue;
    }

    function renderViews() {
      const phoneUp = state && state.isPhoneConnected;
      const cal = state && state.calibration;
      const phase = cal && cal.phase;
      const mode = state && state.trackingMode;
      const live = cal && cal.isCalibrated && (phoneUp || disconnectedAt !== null);
      const showCanvas = phoneUp && (
        (mode === 'stage' && (phase === 'marks' || phase === 'verify' || phase === 'live')) ||
        (mode === 'pointer' && cal.isCalibrated) ||
        live
      );

      setupView.classList.toggle('visible', !phoneUp && !live);
      pointerCalView.classList.toggle('visible', mode === 'pointer' && phoneUp && !cal.isCalibrated);
      canvas.style.display = showCanvas ? 'block' : 'none';

      disconnectBanner.classList.toggle(
        'visible',
        live && !phoneUp && disconnectedAt !== null &&
          performance.now() - disconnectedAt > DISCONNECT_HOLD_MS
      );

      const badgeLabels = { marks: 'Calibrating', verify: 'Verify', live: 'Stage Walk' };
      modeBadge.textContent = mode === 'pointer' ? 'Pointer' : (badgeLabels[phase] || 'Stage Walk');
      modeBadge.classList.toggle('visible', showCanvas && mode === 'stage');
    }

    socket.on('init', ({ state: s, qrDataUrl, mobileUrl, operatorUrl }) => {
      state = s;
      orientation = s.currentOrientation || orientation;
      applySettings(s.settings);
      if (qrDataUrl) document.getElementById('qr-img').src = qrDataUrl;
      if (mobileUrl) document.getElementById('mobile-url').textContent = mobileUrl;
      if (operatorUrl) document.getElementById('operator-url').textContent = operatorUrl;
      if (s.isPhoneConnected) disconnectedAt = null;
      renderViews();
    });

    socket.on('state_update', (s) => {
      const wasConnected = state && state.isPhoneConnected;
      state = s;
      applySettings(s.settings);
      if (s.isPhoneConnected) disconnectedAt = null;
      else if (wasConnected) disconnectedAt = performance.now();
      if (!s.calibration.isCalibrated && s.calibration.phase === 'marks') {
        resetTrackingState();
      }
      renderViews();
    });

    socket.on('orientation_update', (data) => {
      fuseOnPacket(data);
      orientation = data;
      if (!orientation.still) stillPct = null;
    });

    function computeTarget(w, h, dt) {
      const cx = w / 2;
      const cy = h / 2;
      const cal = state && state.calibration;
      if (!cal) return { x: currentX ?? cx, y: currentY ?? cy, mode: 'none', targetPct: 0.5 };

      if (state.trackingMode === 'pointer') {
        if (!cal.isCalibrated) return { x: cx, y: cy, mode: 'none', targetPct: 0.5 };
        const { centerBeta, centerGamma } = cal;
        const centerG = centerGamma ?? 0;
        return {
          x: clamp(cx + (orientation.gamma - centerG) * sensX, 0, w),
          y: clamp(cy + (orientation.beta - centerBeta) * sensY, 0, h),
          mode: 'live',
          targetPct: 0.5,
        };
      }

      const phase = cal.phase;
      if (phase === 'marks') {
        const axis = cal.mappingAxis || 'alpha';
        const captured = cal.points.filter((p) => p.snapshot).length;
        if (captured === 0) {
          return { x: cx, y: cy, mode: 'marks', targetPct: cal.points[cal.currentStep]?.pct ?? 0.5 };
        }
        const value = getStageTrackingValue(axis, dt);
        let pct = applyStageOffset(mapMultiPointToPct(value, cal.points, axis));
        return { x: clamp(pct * w, 0, w), y: cy, mode: 'marks', targetPct: cal.points[cal.currentStep]?.pct ?? 0.5, rawPct: pct };
      }

      if (phase === 'verify' || phase === 'live') {
        const axis = cal.mappingAxis || 'alpha';
        const value = getStageTrackingValue(axis, dt);
        let pct = applyStageOffset(mapMultiPointToPct(value, cal.points, axis));

        if (orientation.still) {
          if (stillPct === null) stillPct = lastRenderedPct;
          pct = stillPct;
        }

        lastRenderedPct = pct;
        const targetX = clamp(pct * w, 0, w);
        return { x: targetX, y: cy, mode: phase === 'verify' ? 'verify' : 'live', rawPct: pct, targetPct: pct };
      }

      return { x: currentX ?? cx, y: currentY ?? cy, mode: 'none', targetPct: 0.5 };
    }

    function drawSpot(x, y, w, h, intensity, scale) {
      const radius = Math.min(w, h) * 0.22 * scale;
      const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
      g.addColorStop(0.0, `rgba(255, 255, 255, ${intensity})`);
      g.addColorStop(0.5, `rgba(255, 255, 255, ${0.85 * intensity})`);
      g.addColorStop(0.8, `rgba(255, 255, 255, ${0.25 * intensity})`);
      g.addColorStop(1.0, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawTargetLine(w, h, pct) {
      const x = pct * w;
      ctx.setLineDash([8, 12]);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, h);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function draw(now) {
      requestAnimationFrame(draw);

      if (isTestMode) {
        window.__spotlightTestHook = {
          currentX,
          currentY,
          lastRenderedPct,
          fusedValue,
          packetFusionActive,
          stillPct,
          orientation: { ...orientation },
          stageOffsetPct: state && state.stageOffsetPct,
          canvasVisible: canvas.style.display !== 'none',
        };
      }

      if (canvas.style.display === 'none') return;

      const dt = lastFrameTime === null ? 0 : Math.min((now - lastFrameTime) / 1000, 0.05);
      lastFrameTime = now;

      const w = window.innerWidth;
      const h = window.innerHeight;
      let target = computeTarget(w, h, dt);

      if (disconnectedAt !== null && state.calibration.isCalibrated) {
        target = { x: currentX ?? w / 2, y: currentY ?? h / 2, mode: 'live', targetPct: lastRenderedPct };
        renderViews();
      }

      const isPreview = target.mode === 'marks';
      const isLive = target.mode === 'live' || target.mode === 'verify';

      if (isLive || isPreview) {
        if (currentX === null) currentX = target.x;
        if (currentY === null) currentY = target.y;

        if (isLive && useOneEuro && target.targetPct != null) {
          const filteredPct = stageEuro.filter(target.targetPct, now);
          currentX = clamp(filteredPct * w, 0, w);
          currentY = target.y;
        } else {
          const smooth = isPreview ? smoothingFactor * 0.5 : smoothingFactor;
          currentX += (target.x - currentX) * smooth;
          currentY += (target.y - currentY) * smooth;
        }
      }

      let intensity = 1;
      if (disconnectedAt !== null) {
        const sinceDrop = now - disconnectedAt;
        if (sinceDrop > DISCONNECT_HOLD_MS) {
          intensity = clamp(1 - (sinceDrop - DISCONNECT_HOLD_MS) / FADE_DURATION_MS, 0, 1);
        }
      }

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, w, h);

      if (isPreview) {
        drawTargetLine(w, h, target.targetPct ?? 0.5);
        drawSpot(currentX, currentY, w, h, 0.4, 0.65);
      } else if (isLive && intensity > 0) {
        drawSpot(currentX, currentY, w, h, intensity, 1);
      }

      if (isTestMode) {
        window.__spotlightTestHook = {
          currentX,
          currentY,
          lastRenderedPct,
          fusedValue,
          packetFusionActive,
          stillPct,
          orientation: { ...orientation },
          stageOffsetPct: state && state.stageOffsetPct,
          canvasVisible: canvas.style.display !== 'none',
        };
      }
    }
    requestAnimationFrame(draw);
  </script>
</body>
</html>
