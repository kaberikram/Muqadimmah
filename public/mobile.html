<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Gyro Spotlight — Transmitter</title>
  <script src="/vendor/tailwind.js"></script>
</head>
<body class="bg-neutral-950 text-white min-h-screen select-none touch-manipulation">
  <div class="max-w-md mx-auto px-5 py-6 flex flex-col gap-5 min-h-screen">

    <!-- Status header -->
    <header class="flex items-center justify-between">
      <h1 class="text-xl font-bold tracking-tight">Spotlight Transmitter</h1>
      <div class="flex items-center gap-2">
        <span id="conn-dot" class="w-3 h-3 rounded-full bg-red-500"></span>
        <span id="conn-label" class="text-sm text-neutral-400">Offline</span>
      </div>
    </header>

    <!-- Live angle readout -->
    <div class="bg-neutral-900 rounded-2xl p-5 text-center">
      <p class="text-neutral-400 text-sm uppercase tracking-widest mb-1">Compass Heading</p>
      <p id="angle-readout" class="text-6xl font-mono font-bold tabular-nums">&mdash;</p>
      <p id="sensor-status" class="text-neutral-500 text-sm mt-2">Sensors inactive</p>
    </div>

    <!-- Step 1: permissions -->
    <button id="activate-btn"
      class="w-full py-6 rounded-2xl bg-blue-600 active:bg-blue-700 text-2xl font-bold shadow-lg transition-colors">
      Activate Motion Sensors
    </button>

    <!-- Step 2: calibration -->
    <div id="calibration-panel" class="flex flex-col gap-3 opacity-40 pointer-events-none transition-opacity">
      <p class="text-neutral-400 text-sm text-center">
        Stand at each edge of the stage, face the projection screen, and tap:
      </p>
      <div class="grid grid-cols-2 gap-3">
        <button id="left-btn"
          class="py-8 rounded-2xl bg-neutral-800 active:bg-neutral-700 text-xl font-bold transition-colors">
          Set Left<br />Boundary
        </button>
        <button id="right-btn"
          class="py-8 rounded-2xl bg-neutral-800 active:bg-neutral-700 text-xl font-bold transition-colors">
          Set Right<br />Boundary
        </button>
      </div>
      <button id="recalibrate-btn"
        class="w-full py-3 rounded-xl bg-neutral-900 text-neutral-400 text-sm font-semibold hidden">
        Recalibrate
      </button>
      <p id="calibration-status" class="text-center text-sm text-neutral-500">Awaiting calibration</p>
    </div>

    <!-- Error / event log -->
    <details class="mt-auto">
      <summary class="text-neutral-500 text-sm cursor-pointer py-2">Event log</summary>
      <div id="log" class="bg-neutral-900 rounded-xl p-3 text-xs font-mono text-neutral-400 max-h-40 overflow-y-auto whitespace-pre-wrap break-words"></div>
    </details>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    'use strict';

    const socket = io();

    const connDot = document.getElementById('conn-dot');
    const connLabel = document.getElementById('conn-label');
    const angleReadout = document.getElementById('angle-readout');
    const sensorStatus = document.getElementById('sensor-status');
    const activateBtn = document.getElementById('activate-btn');
    const calibrationPanel = document.getElementById('calibration-panel');
    const leftBtn = document.getElementById('left-btn');
    const rightBtn = document.getElementById('right-btn');
    const recalibrateBtn = document.getElementById('recalibrate-btn');
    const calibrationStatus = document.getElementById('calibration-status');
    const logEl = document.getElementById('log');

    let sensorsActive = false;
    let currentAngle = null;   // latest heading, rounded to 0.1°
    let lastSentAngle = null;  // last value emitted (dedupe / rate limit)
    let wakeLock = null;

    // ------------------------------------------------------------------
    // On-page logging — devtools aren't available on stage
    // ------------------------------------------------------------------
    function log(msg) {
      const line = `[${new Date().toLocaleTimeString()}] ${msg}\n`;
      logEl.textContent = line + logEl.textContent.slice(0, 4000);
    }
    window.addEventListener('error', (e) => log(`ERROR: ${e.message}`));
    window.addEventListener('unhandledrejection', (e) => log(`REJECTION: ${e.reason}`));

    // ------------------------------------------------------------------
    // Socket status
    // ------------------------------------------------------------------
    socket.on('connect', () => {
      connDot.className = 'w-3 h-3 rounded-full bg-green-500';
      connLabel.textContent = 'Connected';
      log('Socket connected');
      // Re-announce after any reconnect so the desktop leaves the QR screen.
      if (sensorsActive) socket.emit('phone_connected');
    });
    socket.on('disconnect', (reason) => {
      connDot.className = 'w-3 h-3 rounded-full bg-red-500';
      connLabel.textContent = 'Reconnecting…';
      log(`Socket disconnected: ${reason}`);
    });
    socket.on('connect_error', (err) => log(`Socket error: ${err.message}`));

    socket.on('state_update', (state) => renderCalibration(state.calibration));
    socket.on('init', ({ state }) => renderCalibration(state.calibration));

    function renderCalibration(cal) {
      setBoundaryButton(leftBtn, 'Set Left<br />Boundary', cal.leftAngle);
      setBoundaryButton(rightBtn, 'Set Right<br />Boundary', cal.rightAngle);
      recalibrateBtn.classList.toggle('hidden', cal.leftAngle === null && cal.rightAngle === null);
      if (cal.isCalibrated) {
        calibrationStatus.textContent = 'Calibrated — spotlight is live!';
        calibrationStatus.className = 'text-center text-sm text-green-400 font-semibold';
      } else if (cal.leftAngle !== null && cal.rightAngle !== null) {
        // Both set but not calibrated = server rejected them as too close.
        calibrationStatus.textContent = 'Boundaries under 5° apart — recalibrate further apart';
        calibrationStatus.className = 'text-center text-sm text-yellow-400';
      } else {
        calibrationStatus.textContent = 'Awaiting calibration';
        calibrationStatus.className = 'text-center text-sm text-neutral-500';
      }
    }

    function setBoundaryButton(btn, defaultHtml, angle) {
      if (angle !== null) {
        btn.innerHTML = `&#10003; Set<br /><span class="text-sm font-normal">${angle.toFixed(1)}&deg;</span>`;
        btn.className = 'py-8 rounded-2xl bg-green-600 text-xl font-bold transition-colors';
        btn.disabled = true;
      } else {
        btn.innerHTML = defaultHtml;
        btn.className = 'py-8 rounded-2xl bg-neutral-800 active:bg-neutral-700 text-xl font-bold transition-colors';
        btn.disabled = false;
      }
    }

    // ------------------------------------------------------------------
    // Sensor permission + streaming
    // ------------------------------------------------------------------
    function handleOrientation(event) {
      // iOS: webkitCompassHeading is the absolute compass bearing (clockwise
      // from north) and doesn't drift; alpha alone is relative on Safari.
      let heading = null;
      if (typeof event.webkitCompassHeading === 'number' && !Number.isNaN(event.webkitCompassHeading)) {
        heading = event.webkitCompassHeading;
      } else if (typeof event.alpha === 'number' && event.alpha !== null) {
        heading = event.alpha;
      }
      if (heading === null) return;

      currentAngle = Math.round(((heading % 360) + 360) % 360 * 10) / 10;
      angleReadout.textContent = currentAngle.toFixed(1) + '°';

      // Only emit when the rounded value actually changed — dedupes the
      // ~60 Hz sensor stream down to meaningful updates.
      if (currentAngle !== lastSentAngle && socket.connected) {
        lastSentAngle = currentAngle;
        socket.volatile.emit('gyro_update', currentAngle);
      }
    }

    async function acquireWakeLock() {
      if (!('wakeLock' in navigator)) {
        log('Wake Lock API unavailable');
        return;
      }
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => log('Wake lock released'));
        log('Wake lock acquired — screen will stay on');
      } catch (err) {
        log(`Wake lock failed: ${err.message}`);
      }
    }
    // Wake locks are auto-released when the tab is hidden; re-grab on return.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && sensorsActive) acquireWakeLock();
    });

    activateBtn.addEventListener('click', async () => {
      try {
        // iOS 13+ requires an explicit permission grant from a user gesture.
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
          const result = await DeviceOrientationEvent.requestPermission();
          if (result !== 'granted') {
            log(`Motion permission ${result}`);
            sensorStatus.textContent = 'Permission denied — check Safari settings';
            sensorStatus.className = 'text-red-400 text-sm mt-2';
            return;
          }
        }

        window.addEventListener('deviceorientation', handleOrientation);
        sensorsActive = true;
        socket.emit('phone_connected');
        await acquireWakeLock();

        activateBtn.textContent = '✓ Sensors Active';
        activateBtn.className = 'w-full py-6 rounded-2xl bg-green-600 text-2xl font-bold shadow-lg';
        activateBtn.disabled = true;
        sensorStatus.textContent = 'Streaming orientation…';
        sensorStatus.className = 'text-green-400 text-sm mt-2';
        calibrationPanel.classList.remove('opacity-40', 'pointer-events-none');
        log('Sensors activated');
      } catch (err) {
        log(`Activation failed: ${err.message}`);
        sensorStatus.textContent = 'Activation failed — see event log';
        sensorStatus.className = 'text-red-400 text-sm mt-2';
      }
    });

    // ------------------------------------------------------------------
    // Calibration buttons
    // ------------------------------------------------------------------
    function sendCalibration(eventName, btn) {
      if (currentAngle === null) {
        log('No sensor reading yet — walk around a little and retry');
        calibrationStatus.textContent = 'No heading yet — sensors warming up';
        calibrationStatus.className = 'text-center text-sm text-yellow-400';
        return;
      }
      const angle = currentAngle;
      btn.disabled = true;
      socket.emit(eventName, angle, (res) => {
        if (res && res.ok === false && res.error) {
          log(`Calibration rejected: ${res.error}`);
          calibrationStatus.textContent = res.error;
          calibrationStatus.className = 'text-center text-sm text-yellow-400';
          btn.disabled = false;
        } else {
          log(`${eventName} = ${angle.toFixed(1)}°`);
        }
      });
    }

    leftBtn.addEventListener('click', () => sendCalibration('calibrate_left', leftBtn));
    rightBtn.addEventListener('click', () => sendCalibration('calibrate_right', rightBtn));
    recalibrateBtn.addEventListener('click', () => {
      socket.emit('reset_calibration');
      log('Calibration reset');
    });
  </script>
</body>
</html>
