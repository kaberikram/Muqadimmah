<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Gyro Spotlight — Laser Pointer</title>
  <script src="/vendor/tailwind.js"></script>
</head>
<body class="bg-neutral-950 text-white min-h-screen select-none touch-manipulation">
  <div class="max-w-md mx-auto px-5 py-6 flex flex-col gap-5 min-h-screen">

    <header class="flex items-center justify-between">
      <h1 class="text-xl font-bold tracking-tight">Laser Pointer</h1>
      <div class="flex items-center gap-2">
        <span id="conn-dot" class="w-3 h-3 rounded-full bg-red-500"></span>
        <span id="conn-label" class="text-sm text-neutral-400">Offline</span>
      </div>
    </header>

    <div class="bg-neutral-900 rounded-2xl p-5 text-center">
      <p class="text-neutral-400 text-sm uppercase tracking-widest mb-1">Aim angles</p>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <p class="text-neutral-500 text-xs uppercase">Pan (γ)</p>
          <p id="gamma-readout" class="text-3xl font-mono font-bold tabular-nums">&mdash;</p>
        </div>
        <div>
          <p class="text-neutral-500 text-xs uppercase">Tilt (β)</p>
          <p id="beta-readout" class="text-3xl font-mono font-bold tabular-nums">&mdash;</p>
        </div>
      </div>
      <p id="sensor-status" class="text-neutral-500 text-sm mt-3">Sensors inactive</p>
    </div>

    <button id="activate-btn"
      class="w-full py-6 rounded-2xl bg-blue-600 active:bg-blue-700 text-2xl font-bold shadow-lg transition-colors">
      Activate Motion Sensors
    </button>

    <div id="pointer-panel" class="hidden flex-col gap-4 opacity-40 pointer-events-none transition-opacity">
      <p class="text-neutral-400 text-sm text-center leading-relaxed">
        Hold phone like a <strong class="text-white">laser pointer</strong> — top edge toward screen.<br />
        Point at center → <strong class="text-white">Calibrate</strong>. Higher reach = faster sweep.
      </p>

      <button id="calibrate-btn"
        class="w-full py-8 rounded-2xl bg-blue-600 active:bg-blue-700 text-xl font-bold transition-colors">
        Calibrate Center
      </button>
      <p id="calibrate-status" class="text-center text-sm text-neutral-500">
        Point at projector center, then tap Calibrate
      </p>

      <button id="recenter-btn"
        class="w-full py-4 rounded-2xl bg-neutral-800 active:bg-neutral-700 text-lg font-semibold transition-colors hidden">
        Re-calibrate Center
      </button>

      <div class="bg-neutral-900 rounded-xl p-4 space-y-4">
        <div>
          <label for="sens-x-slider" class="text-sm text-neutral-400 block mb-2">
            Horizontal reach — <span id="sens-x-value" class="text-white font-mono">58</span>
            <span class="text-neutral-600 text-xs"> (higher = faster)</span>
          </label>
          <input id="sens-x-slider" type="range" min="20" max="120" step="1" value="58" class="w-full accent-blue-500" />
        </div>
        <div>
          <label for="sens-y-slider" class="text-sm text-neutral-400 block mb-2">
            Vertical reach — <span id="sens-y-value" class="text-white font-mono">52</span>
            <span class="text-neutral-600 text-xs"> (higher = faster)</span>
          </label>
          <input id="sens-y-slider" type="range" min="20" max="120" step="1" value="52" class="w-full accent-blue-500" />
        </div>
      </div>

      <div id="effects-panel" class="hidden flex-col gap-3">
        <p class="text-neutral-400 text-sm text-center uppercase tracking-widest">Effects</p>
        <div class="grid grid-cols-3 gap-2">
          <button id="burst-btn" type="button"
            class="py-5 rounded-2xl bg-amber-600 active:bg-amber-700 font-bold text-sm leading-tight touch-manipulation">
            Burst
          </button>
          <button id="expand-btn" type="button"
            class="py-5 rounded-2xl bg-violet-600 active:bg-violet-700 font-bold text-sm leading-tight touch-manipulation select-none">
            Expand<br /><span class="text-xs font-normal opacity-80">hold</span>
          </button>
          <button id="aura-btn" type="button"
            class="py-5 rounded-2xl bg-cyan-700 active:bg-cyan-800 font-bold text-sm leading-tight touch-manipulation">
            Aura
          </button>
        </div>
      </div>
    </div>

    <details class="mt-auto">
      <summary class="text-neutral-500 text-sm cursor-pointer py-2">Event log</summary>
      <div id="log" class="bg-neutral-900 rounded-xl p-3 text-xs font-mono text-neutral-400 max-h-40 overflow-y-auto whitespace-pre-wrap break-words"></div>
    </details>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    'use strict';

    const socket = io();

    const connDot = document.getElementById('conn-dot');
    const connLabel = document.getElementById('conn-label');
    const gammaReadout = document.getElementById('gamma-readout');
    const betaReadout = document.getElementById('beta-readout');
    const sensorStatus = document.getElementById('sensor-status');
    const activateBtn = document.getElementById('activate-btn');
    const pointerPanel = document.getElementById('pointer-panel');
    const calibrateBtn = document.getElementById('calibrate-btn');
    const calibrateStatus = document.getElementById('calibrate-status');
    const recenterBtn = document.getElementById('recenter-btn');
    const sensXSlider = document.getElementById('sens-x-slider');
    const sensYSlider = document.getElementById('sens-y-slider');
    const sensXValue = document.getElementById('sens-x-value');
    const sensYValue = document.getElementById('sens-y-value');
    const logEl = document.getElementById('log');
    const effectsPanel = document.getElementById('effects-panel');
    const burstBtn = document.getElementById('burst-btn');
    const expandBtn = document.getElementById('expand-btn');
    const auraBtn = document.getElementById('aura-btn');

    let sensorsActive = false;
    let wakeLock = null;
    let currentOrientation = null;
    let smoothedBeta = null;
    let smoothedGamma = null;
    let isCalibrated = false;
    let auraActive = false;
    let orientSource = 'none';
    let emaGamma = 0.65;
    let emaBeta = 0.6;
    let pendingOrientation = null;
    let emitFrameScheduled = false;

    function log(msg) {
      const line = `[${new Date().toLocaleTimeString()}] ${msg}\n`;
      logEl.textContent = line + logEl.textContent.slice(0, 4000);
    }
    window.addEventListener('error', (e) => log(`ERROR: ${e.message}`));
    window.addEventListener('unhandledrejection', (e) => log(`REJECTION: ${e.reason}`));

    function round1(v) {
      return Math.round(v * 10) / 10;
    }

    function applySettings(settings) {
      if (!settings) return;
      emaGamma = settings.orientationEmaGamma ?? emaGamma;
      emaBeta = settings.orientationEmaBeta ?? emaBeta;
      sensXSlider.value = String(settings.pointerSensitivityX ?? 58);
      sensYSlider.value = String(settings.pointerSensitivityY ?? 52);
      sensXValue.textContent = sensXSlider.value;
      sensYValue.textContent = sensYSlider.value;
    }

    function haptic(ms = 12) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    function renderCalState() {
      if (isCalibrated) {
        calibrateBtn.innerHTML = '&#10003; Center Calibrated';
        calibrateBtn.className = 'w-full py-6 rounded-2xl bg-green-600 text-xl font-bold transition-colors';
        calibrateStatus.textContent = 'Aim to move spotlight — tap Re-calibrate if drift appears';
        calibrateStatus.className = 'text-center text-sm text-green-400 font-semibold';
        recenterBtn.classList.remove('hidden');
        effectsPanel.classList.remove('hidden');
        effectsPanel.classList.add('flex');
      } else {
        calibrateBtn.textContent = 'Calibrate Center';
        calibrateBtn.className = 'w-full py-8 rounded-2xl bg-blue-600 active:bg-blue-700 text-xl font-bold transition-colors';
        calibrateStatus.textContent = 'Point at projector center, then tap Calibrate';
        calibrateStatus.className = 'text-center text-sm text-neutral-500';
        recenterBtn.classList.add('hidden');
        effectsPanel.classList.add('hidden');
        effectsPanel.classList.remove('flex');
      }
      renderAuraBtn();
    }

    function renderAuraBtn() {
      if (auraActive) {
        auraBtn.className = 'py-5 rounded-2xl bg-cyan-500 ring-2 ring-cyan-300 font-bold text-sm leading-tight touch-manipulation';
        auraBtn.textContent = 'Aura ON';
      } else {
        auraBtn.className = 'py-5 rounded-2xl bg-cyan-700 active:bg-cyan-800 font-bold text-sm leading-tight touch-manipulation';
        auraBtn.textContent = 'Aura';
      }
    }

    function enablePointerPanel() {
      pointerPanel.classList.remove('hidden', 'opacity-40', 'pointer-events-none');
      pointerPanel.classList.add('flex');
    }

    socket.on('connect', () => {
      connDot.className = 'w-3 h-3 rounded-full bg-green-500';
      connLabel.textContent = 'Connected';
      log('Socket connected');
      if (sensorsActive) socket.emit('phone_connected');
    });
    socket.on('disconnect', (reason) => {
      connDot.className = 'w-3 h-3 rounded-full bg-red-500';
      connLabel.textContent = 'Reconnecting…';
      log(`Socket disconnected: ${reason}`);
    });
    socket.on('connect_error', (err) => log(`Socket error: ${err.message}`));

    socket.on('state_update', (s) => {
      isCalibrated = s.isCalibrated;
      auraActive = !!s.auraActive;
      applySettings(s.settings);
      renderCalState();
    });
    socket.on('init', ({ state: s }) => {
      isCalibrated = s.isCalibrated;
      auraActive = !!s.auraActive;
      applySettings(s.settings);
      renderCalState();
    });

    function emitOrientation() {
      if (!currentOrientation || !socket.connected) return;
      socket.emit('orientation_update', {
        alpha: currentOrientation.alpha,
        beta: currentOrientation.beta,
        gamma: currentOrientation.gamma,
        t: performance.now(),
      });
    }

    function scheduleOrientationEmit() {
      if (emitFrameScheduled) return;
      emitFrameScheduled = true;
      requestAnimationFrame(() => {
        emitFrameScheduled = false;
        if (!pendingOrientation) return;
        currentOrientation = pendingOrientation;
        emitOrientation();
      });
    }

    function handleOrientation(event) {
      if (typeof event.beta !== 'number' || event.beta === null) return;
      if (typeof event.gamma !== 'number' || event.gamma === null) return;

      const rawBeta = event.beta;
      const rawGamma = event.gamma;
      smoothedBeta = smoothedBeta === null
        ? rawBeta
        : smoothedBeta + (rawBeta - smoothedBeta) * emaBeta;
      smoothedGamma = smoothedGamma === null
        ? rawGamma
        : smoothedGamma + (rawGamma - smoothedGamma) * emaGamma;

      const beta = smoothedBeta;
      const gamma = smoothedGamma;
      const alpha = typeof event.alpha === 'number' && event.alpha !== null
        ? round1(((event.alpha % 360) + 360) % 360)
        : 0;

      pendingOrientation = { alpha, beta, gamma };
      gammaReadout.textContent = `${gamma.toFixed(1)}°`;
      betaReadout.textContent = `${beta.toFixed(1)}°`;
      scheduleOrientationEmit();
    }

    async function acquireWakeLock() {
      if (!('wakeLock' in navigator)) return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => log('Wake lock released'));
        log('Wake lock acquired');
      } catch (err) {
        log(`Wake lock failed: ${err.message}`);
      }
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && sensorsActive) acquireWakeLock();
    });

    activateBtn.addEventListener('click', async () => {
      try {
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
          const result = await DeviceOrientationEvent.requestPermission();
          if (result !== 'granted') {
            log(`Orientation permission ${result}`);
            sensorStatus.textContent = 'Permission denied — check Safari settings';
            sensorStatus.className = 'text-red-400 text-sm mt-3';
            return;
          }
        }

        const useAbsolute = 'ondeviceorientationabsolute' in window;
        orientSource = useAbsolute ? 'deviceorientationabsolute' : 'deviceorientation';
        window.addEventListener(orientSource, handleOrientation);
        log(`Orientation source: ${orientSource}`);

        sensorsActive = true;
        socket.emit('phone_connected');
        await acquireWakeLock();

        activateBtn.textContent = '✓ Sensors Active';
        activateBtn.className = 'w-full py-6 rounded-2xl bg-green-600 text-2xl font-bold shadow-lg';
        activateBtn.disabled = true;
        sensorStatus.textContent = 'Point at screen center to calibrate';
        sensorStatus.className = 'text-green-400 text-sm mt-3';
        enablePointerPanel();
        renderCalState();
        log('Ready — point at center, tap Calibrate Center');
      } catch (err) {
        log(`Activation failed: ${err.message}`);
        sensorStatus.textContent = 'Activation failed — see event log';
        sensorStatus.className = 'text-red-400 text-sm mt-3';
      }
    });

    function calibrateCenter() {
      const aim = pendingOrientation || currentOrientation;
      if (!aim) {
        calibrateStatus.textContent = 'No reading yet — move the phone slightly';
        calibrateStatus.className = 'text-center text-sm text-yellow-400';
        return;
      }
      calibrateBtn.disabled = true;
      socket.emit('calibrate_center', aim, (res) => {
        calibrateBtn.disabled = false;
        if (res && res.ok === false && res.error) {
          log(`Calibrate rejected: ${res.error}`);
          calibrateStatus.textContent = res.error;
          calibrateStatus.className = 'text-center text-sm text-yellow-400';
          return;
        }
        isCalibrated = true;
        log(`Center = β ${aim.beta.toFixed(1)}° γ ${aim.gamma.toFixed(1)}°`);
        renderCalState();
      });
    }

    calibrateBtn.addEventListener('click', calibrateCenter);
    recenterBtn.addEventListener('click', calibrateCenter);

    function updateSetting(key, value, labelEl, displayValue) {
      labelEl.textContent = displayValue;
      socket.emit('update_settings', { key, value }, (res) => {
        if (res && res.ok) log(`${key} → ${displayValue}`);
      });
    }

    sensXSlider.addEventListener('input', () => {
      const value = parseInt(sensXSlider.value, 10);
      updateSetting('pointerSensitivityX', value, sensXValue, String(value));
    });
    sensYSlider.addEventListener('input', () => {
      const value = parseInt(sensYSlider.value, 10);
      updateSetting('pointerSensitivityY', value, sensYValue, String(value));
    });

    burstBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      haptic(20);
      socket.emit('effect_burst', {}, (res) => {
        if (res && res.ok) log('Burst!');
      });
    });

    function setExpand(active) {
      expandBtn.classList.toggle('ring-2', active);
      expandBtn.classList.toggle('ring-violet-300', active);
      expandBtn.classList.toggle('bg-violet-500', active);
      expandBtn.classList.toggle('bg-violet-600', !active);
      socket.emit('effect_expand', { active });
    }

    expandBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      haptic(8);
      setExpand(true);
    });
    expandBtn.addEventListener('pointerup', () => setExpand(false));
    expandBtn.addEventListener('pointercancel', () => setExpand(false));
    expandBtn.addEventListener('pointerleave', () => setExpand(false));

    auraBtn.addEventListener('click', () => {
      auraActive = !auraActive;
      haptic(15);
      renderAuraBtn();
      socket.emit('effect_aura', { active: auraActive }, (res) => {
        if (res && res.ok) log(`Aura ${auraActive ? 'on' : 'off'}`);
      });
    });
  </script>
</body>
</html>
